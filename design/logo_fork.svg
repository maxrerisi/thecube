<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Pitchfork logo (fork + background layer; W and U are set in Adobe Garamond Pro Bold by make_logo.sh): "W/U" (WU = Duke's main dining hall) with a devil's pitchfork as the slash.
       Hand-written SVG, no generated imagery. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A5DB8"/>
      <stop offset="1" stop-color="#012169"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(0.86) translate(-512 -512)">
  <!-- pitchfork, drawn upright then turned 45 degrees to be the slash -->
  <g transform="translate(512 512) rotate(45)" fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="-250" x2="0" y2="430" stroke-width="50"/>
    <path d="M -105 -430 V -330 Q -105 -250 0 -250 Q 105 -250 105 -330 V -430" fill="none" stroke-width="44"/>
    <line x1="0" y1="-250" x2="0" y2="-455" stroke-width="44"/>
    <!-- barbed tips -->
    <path d="M -140 -415 L -105 -505 L -70 -415 Z" stroke-width="10"/>
    <path d="M -35 -440 L 0 -530 L 35 -440 Z" stroke-width="10"/>
    <path d="M 70 -415 L 105 -505 L 140 -415 Z" stroke-width="10"/>
  </g>
  </g>
</svg>
