[project]
name = "dukedining"
version = "0.1.0"
description = "See what you actually bought with your DukeCard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "jinja2",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"app/routes/*.py" = ["B008"]
